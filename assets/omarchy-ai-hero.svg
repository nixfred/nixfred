<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="ht hd">
<title id="ht">Omarchy multiplied by AI — Fred Nix</title>
<desc id="hd">An Omarchy top bar rendered above a title reading OMARCHY x AI, with three pillars: the desktop Fred runs and extends with plugins, the AI collaborator that helps build them, and the infrastructure that remembers.</desc>
<defs>
<linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d16"/><stop offset=".55" stop-color="#0f1424"/><stop offset="1" stop-color="#161226"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2135"/><stop offset="1" stop-color="#141926"/></linearGradient>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#7dd3fc" stop-opacity=".30"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
</defs>

<rect width="1600" height="700" rx="30" fill="url(#hbg)"/>
<ellipse cx="800" cy="150" rx="760" ry="230" fill="url(#glow)"/>

<!-- top bar mock -->
<g>
  <rect x="60" y="52" width="1480" height="68" rx="18" fill="url(#bar)" stroke="#2b3550"/>
  <!-- workspaces -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" text-anchor="middle">
    <rect x="84" y="70" width="40" height="32" rx="10" fill="#7dd3fc"/><text x="104" y="93" fill="#0a0d16" font-weight="700">1</text>
    <rect x="132" y="70" width="40" height="32" rx="10" fill="#243049"/><text x="152" y="93" fill="#8ba0c4">2</text>
    <rect x="180" y="70" width="40" height="32" rx="10" fill="#243049"/><text x="200" y="93" fill="#8ba0c4">3</text>
    <rect x="228" y="70" width="40" height="32" rx="10" fill="#243049"/><text x="248" y="93" fill="#8ba0c4">4</text>
    <rect x="276" y="70" width="40" height="32" rx="10" fill="#243049"/><text x="296" y="93" fill="#8ba0c4">5</text>
  </g>
  <!-- workspace-names pill -->
  <rect x="332" y="70" width="176" height="32" rx="16" fill="#1d2740" stroke="#3b4a72"/>
  <text x="420" y="92" fill="#a5b4fc" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">omarchy · plugins</text>

  <!-- chronos clock center -->
  <circle cx="800" cy="86" r="21" fill="none" stroke="#2f3d5e" stroke-width="4"/>
  <path d="M800 65 a21 21 0 0 1 18 31" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
  <text x="838" y="93" fill="#e6edf7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" font-weight="600">09:41</text>
  <text x="920" y="93" fill="#6b7ea3" font-family="system-ui,sans-serif" font-size="15">68.4%</text>

  <!-- right side pills -->
  <g font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">
    <rect x="1046" y="70" width="86" height="32" rx="16" fill="#1b2b25" stroke="#2f6b52"/><text x="1089" y="91" fill="#6ee7b7">blip 3</text>
    <rect x="1140" y="70" width="98" height="32" rx="16" fill="#2b2117" stroke="#7a5a2c"/><text x="1189" y="91" fill="#fbbf24">burn 41%</text>
    <rect x="1246" y="70" width="86" height="32" rx="16" fill="#171f33" stroke="#3b4a72"/><text x="1289" y="91" fill="#93c5fd">󰂯 88%</text>
    <rect x="1340" y="70" width="86" height="32" rx="16" fill="#221a2b" stroke="#5b3f74"/><text x="1383" y="91" fill="#d8b4fe">rift</text>
    <rect x="1434" y="70" width="82" height="32" rx="16" fill="#2a1a20" stroke="#7a3b4c"/><text x="1475" y="91" fill="#fda4af">21°</text>
  </g>
</g>

<!-- title -->
<text x="800" y="272" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="96" font-weight="800" fill="url(#title)" letter-spacing="2">OMARCHY × AI</text>
<text x="800" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" fill="#8ba0c4">I don&#8217;t build the desktop. I build for it &#8212; with an AI that lives on it.</text>

<!-- three pillars -->
<g>
  <rect x="96" y="378" width="440" height="196" rx="20" fill="#101728" stroke="#2b3550"/>
  <rect x="580" y="378" width="440" height="196" rx="20" fill="#101728" stroke="#2b3550"/>
  <rect x="1064" y="378" width="440" height="196" rx="20" fill="#101728" stroke="#2b3550"/>

  <circle cx="146" cy="424" r="15" fill="#7dd3fc"/>
  <circle cx="630" cy="424" r="15" fill="#c4b5fd"/>
  <circle cx="1114" cy="424" r="15" fill="#6ee7b7"/>

  <g font-family="system-ui,sans-serif" fill="#e6edf7" font-size="27" font-weight="700">
    <text x="176" y="433">THE DESKTOP</text>
    <text x="660" y="433">THE COLLABORATOR</text>
    <text x="1144" y="433">THE FLEET</text>
  </g>
  <g font-family="system-ui,sans-serif" fill="#8ba0c4" font-size="18">
    <text x="130" y="480">Omarchy + Hyprland + Quickshell &#8212;</text>
    <text x="130" y="508">not mine. The plugins are:</text>
    <text x="130" y="536">iMessage, screen mirroring, clocks,</text>
    <text x="130" y="564">Bluetooth sonar, live wallpapers.</text>

    <text x="614" y="480">Claude Code wrapped in skills,</text>
    <text x="614" y="508">hooks, agents and an algorithm.</text>
    <text x="614" y="536">Persistent memory means every</text>
    <text x="614" y="564">session starts where the last ended.</text>

    <text x="1098" y="480">Homelab across Docker, K3s, Incus,</text>
    <text x="1098" y="508">Tailscale mesh and GPU compute.</text>
    <text x="1098" y="536">Local models, remote models,</text>
    <text x="1098" y="564">one bar watching all of it.</text>
  </g>
</g>

<text x="800" y="646" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#5a6b8c" letter-spacing="4">FRED &#8220;SPIKE&#8221; NIX · AI INFRASTRUCTURE ARCHITECT · ATLANTA</text>
</svg>
